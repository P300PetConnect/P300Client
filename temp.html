<div style="padding-top: 3rem;" class="container-fluid">

    <div class="jumbotron">
        <div class="container-fluid">


            <div class="row">

                <div style="background-color: white;" class="col-6 col-md-4">
                    <ul style="margin-bottom: 3rem;" class="nav nav-pills nav-fill">
                        <li id="mkRoute" class="nav-item">
                            <a (click)="onClickshowMakeRoute()" class="nav-link active" aria-current="page">Create
                                Route</a>
                        </li>
                        <li id="GenRoute" class="nav-item">
                            <a (click)="onClickshowGenRoute()" class="nav-link">Recommend Route</a>
                        </li>
                        <li id="FavRoute" class="nav-item">
                            <a (click)="onClickshowFavRoute()" class="nav-link">My Routes</a>
                        </li>
                    </ul>

                    <!-- Form for Making routes  -->
                    <form id="formm" class="form-horizontal ">

                        <div class="form-group">
                            <label for="from" class="col-xs-3 control-label"><i onclick="GetCurrentLocationForInputG()"
                                    class="far fa-dot-circle"></i> <label style="margin-left:3%;" for="from">
                                    From</label></label>
                            <div class="col-xs-6">
                                <input type="text" id="from" placeholder="Origin" class="form-control"
                                    [(ngModel)]="startPoint">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="to" class="col-xs-3 control-label"><i class="fas fa-map-marker-alt"></i> <label
                                    style="margin-left:3%;" for="from"> To</label></label>
                            <div class="col-xs-6">
                                <input type="text" name="to" id="to" placeholder="Destination" class="form-control"
                                    [(ngModel)]="endPoint">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="to" class="col-xs-3 control-label"><i class="fas fa-map-marker-alt"></i> <label
                                    style="margin-left:3%;" for="RouteName"> Route Name</label></label>
                            <div class="col-xs-6">
                                <input type="text" name="RouteName" id="RouteName" placeholder="Route Name"
                                    class="form-control" [(ngModel)]="routeName">
                            </div>
                        </div>


                        <div style="margin-top: 0rem; margin-bottom:1rem;margin-right: 2rem;"
                            class="col-xs-offset-2 col-xs-10">
                            <button class="btn btn-info btn-lg " (click)="onClickcalcRoute()"><i
                                    class="fas fa-map-signs">Preview
                                    Route</i></button>
                            <button style="margin-left: 1rem;" class="btn btn-info btn-lg" (click)="createPostSave()"><i
                                    class="fas fa-map-signs">Save
                                    Route</i></button>

                        </div>
                        <!-- End of adding the list of routes -->


                    </form>
                    <!-- Form for generating routes -->
                    <form id="formmG" style="display: none;" class="form-horizontal ">

                        <div class="form-group">

                            <label for="fromG" class="col-xs-4 control-label"><i onclick="GetCurrentLocationForInput()"
                                    class="far fa-dot-circle"></i> <label style="margin-left:3%;" for="from"> Starting
                                    Point</label></label>
                            <div class="col-xs-4">
                                <input type="text" id="fromG" placeholder="Origin" class="form-control">

                            </div>
                        </div>

                        <div class="form-group">

                            <label for="DistanceG" class="col-xs-4 control-label"><i class="fas fa-map-marker-alt"></i>
                                <label style="margin-left:3%;" for="from">Distance</label></label>
                            <div class="col-xs-4">
                                <input type="text" id="DistanceG" placeholder="Distance" class="form-control">
                            </div>

                        </div>
                        <!-- Progress bar -->
                        <div id="Progress_Status">
                            <div id="myprogressBar"></div>
                        </div>



                        <div class="col-xs-offset-2 col-xs-10">
                            <button class="btn btn-info btn-lg " onclick="GenerateRoutes();"><i
                                    class="fas fa-map-signs"> Generate
                                    Routes</i></button>
                        </div>

                        <div id="routesBox2">
                            <div class="accordion" id="accordionExample2">


                            </div>
                        </div>
                    </form>
                    <div style="display: none;" id="routesBoxes">
                        <h3 style="color: black;" (click)="getArray2()">Faviourite routes</h3>


                        <div id="routesBox">
                            <div class="accordion" id="accordionExampleFav">



                            </div>
                        </div>

                        <!-- End of trying to add the data from atlas -->
                    </div>
                    <!-- End of form for generating form  -->

                    <div id="output">

                    </div>

                </div>
                <div class="col-8 col-md-8">
                    <div id="map">

                    </div>
                </div>

            </div>

        </div>
        <!-- Adding the list of routes -->

        <div class="container-fluid">

            <!-- <div id="map">
  
        </div> -->
            <div id="output">

            </div>
        </div>

    </div>


    <!-- End of trying dialog -->
</div>

<div class="modal" [class.show]="isOpen">
    <div class="modal-body">
        <form>
            <div class="form-group">
                <label for="routeNameed">Route Name</label>
                <input type="email" class="form-control" id="routeNameed" aria-describedby="emailHelp"
                    [ngModelOptions]="{standalone: true}" placeholder="Enter email" [(ngModel)]="routeName">
                <small id="emailHelp" class="form-text text-muted">Give your route a meaningful name</small>
            </div>
            <div class="form-group">
                <label for="fromed">From</label>
                <input [ngModelOptions]="{standalone: true}" type="text" class="form-control" id="fromed"
                    placeholder="start" [(ngModel)]="startPoint">
            </div>

            <div class="form-group">
                <label for="toEd">To</label>
                <input [ngModelOptions]="{standalone: true}" type="text" class="form-control" id="toEd"
                    placeholder="destination" [(ngModel)]="endPoint">
            </div>
            <button (click)="toggleClose()">close</button>
            <button class="btn btn-primary" (click)="updatePost()">Submit</button>
        </form>
        <!-- Your form fields here -->

    </div>
</div>
