name: GitHub Pages

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: AKIAVZODYHL27WBMPNCS
        aws-secret-access-key: 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
        aws-region: eu-west-1

    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 14

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test:headless

    - name: Build
      run: npm run build:prod

    - name: Deploy
      if: success()
      run: aws s3 sync /Users/jessicahenry/P300Client/client/dist/client s3://mywebapppetconnect/dist/client/