

<div class="col-md-12 col-xl-12">
    <div class="test card card-click mb-3" (click)="SearchSitter(service.EmailAddress, service.UserID)">
      <div class="card-body text-center ">
      <div class="row">
          <div class="col-2">
              <img src="{{service.Profile_Pic_URL}}" class="img-fluid rounded-circle mb-2" width="100" height="100">
          </div>
          <div class="col-10 text-left">
              <div class="d-flex justify-content-between">
                      <h5>{{service.Name}} {{service.Surname}}</h5>
                      <img data-src="../../../assets/images/home/medal-01.svg" alt="Icon Security" class="ls-is-cached lazyloaded"
                      src="../../../assets/images/home/medal-01.svg" width="30px" height="30px">
                    
              </div>
              <div class="d-flex justify-content-between">
               
                <p>{{service.Line_2}}, {{service.County}}</p>
               
              </div>
    
              
              <div class="row">
                  <div class="d-flex justify-content-between">
                      <div class="h-100" *ngIf="service.NumReviews > 0">
                          <span *ngFor="let _ of [].constructor(service.ReviewsTotal / service.NumReviews | number:'0.0-0')" class="bi bi-star-fill"></span>
                          <span class="review my-auto pl-2">{{service.ReviewsTotal / service.NumReviews | number:'1.2-2'}}   ({{service.NumReviews}}) </span>
                      </div>
                      <div class="h-100" *ngIf="service.NumReviews <= 0">
                        
                        <span class="review my-auto pl-2">No Reviews yet</span>
                    </div>
                      <p>1 mile distance</p>
              </div>
              </div>
              <div class="row">
                  <div class="d-flex justify-content-between">
                      <i class="details bi bi-repeat"> 165 Loyal clients</i>
                      <p>Starting at € 15.00 / night</p>
                  </div>
              </div>

                <div class = "col justify-content-md-center pt-3 service">
                    <p>{{service.Description}}</p>
                </div>
            </div> -->

                          <p>{{o.Description}}</p>
                        </div>
                    </div>
                </div> -->
                <!-- <div class = "row justify-content-md-center">
                  <button class = "btn btn-info" (click)="getOtherServices(service.UserID)">Other services</button>
              </div> -->
          </div>
      </div>
      </div>
    </div>
  </div>
