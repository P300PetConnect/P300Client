<div class="home-section">
  <section>
    <div class="main-container">
      <div class="home-searchbox">
        <div class="row pt-4 text-center ">
          <div class="col-2"></div>
            <div class="col-8 pt-4 bg-white home-search-box">
              <h1>Just the best for your pet</h1>
              <p>Find the best care</p>
              <div class="row">
                <div class="col-sm-3 col-md-3">
                  <a role="tab" class="nav-item nav-link first-item nav-host active">
                    <picture  class="align-initial">
                      <img  src="../../../assets/images/home/boarding-selected.svg"
                       alt="Accommodation" class="img-fluid"></picture>
                       <span  class="align-middle nav-title"><strong class="d-inline-block d-md-inline title">Accommodation</strong>
                        <br></span></a>
                </div>
                <div class="col-sm-3 col-md-3">
                  <a role="tab" class="nav-item nav-link second-item nav-host">
                    <picture  class="align-initial">
                      <img  src="../../../assets/images/home/boarding-selected.svg"
                       alt="Creche" class="img-fluid"></picture>
                       <span  class="align-middle nav-title"><strong class="d-inline-block d-md-inline title">Creche</strong>
                        <br></span></a>
                </div>
                <div class="col-sm-3 col-md-3">
                  <a role="tab" class="nav-item nav-link first-item nav-host">
                    <picture  class="align-initial">
                      <img  src="../../../assets/images/home/boarding-selected.svg"
                       alt="Home Sitter" class="img-fluid"></picture>
                       <span  class="align-middle nav-title"><strong class="d-inline-block d-md-inline title">My Home Sitter</strong>
                        <br></span></a>
                </div>
                <div class="col-sm-3 col-md-3">
                  <a role="tab" class="nav-item nav-link first-item nav-host">
                    <picture  class="align-initial">
                      <img  src="../../../assets/images/home/boarding-selected.svg"
                       alt="Walk" class="img-fluid"></picture>
                       <span  class="align-middle nav-title"><strong class="d-inline-block d-md-inline title">Walk</strong>
                        <br></span></a>
                </div>
              </div>
            </div>
        </div>
      </div>
    </div>
  </section>
</div>
