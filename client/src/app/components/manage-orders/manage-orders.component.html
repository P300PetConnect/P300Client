<div class="container">
    <h2 class="pt-4 pb-4">Manage Orders</h2>
    <div class="row">
        <div class="col-12">
            <mat-tab-group animationDuration="0ms">
                <mat-tab label="COMPLETED" (click)="getOrders()">
                        <div class="panel panel-default">
                                <div class="panel-heading">
                                </div>
                        <div class="panel-body pt-5">
                                    <table class="table table-condensed table-striped">
                    <thead>
                        <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                         <th></th>
                         <th></th>
                        <th></th>
                        <th></th>
                        <th>DATE</th>
                        <th>DUE ON</th>
                        <th>TOTAL</th>
                        <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody  *ngFor="let o of orders">
        <tr  data-toggle="collapse" data-target="#indexOfelement" class="accordion-toggle">
            <td><button class="btn btn-default btn-xs"><span class="glyphicon glyphicon-eye-open"></span></button></td>
            <td><img src="https://www.we-love-pets.co.uk/hubfs/Emma%20Curtis%20Bridgend.jpg" width="65px" alt=""></td>
            <td>{{o.ServiceTitle}}</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td>{{o.OrderDate | date}}</td>
            <td>{{o.OrderDate | date}}</td>
            <td>{{o.Price }}</td>
            <td>{{o.Status}}</td>
        </tr>
        <tr>
            <td colspan="6" class="hiddenRow"><div id="indexOfelement" class="accordian-body collapse">{{o.Description}}</div></td>
        </tr>
    </tbody>
</table>
            </div>
          </div> 
                </mat-tab>
                <mat-tab label="COMPLETED">
                    <div class="row pt-4 container">
                        <div class="col-4">
                            <div class="card p-4">
                                <div class="text-center card-body">
                                    <div class="member-card">
                                        <i class="bi bi-plus-circle-fill text-info"></i>
                                        <p>Create a new Service</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </mat-tab>
                <mat-tab label="DRAFT">

                </mat-tab>
                <mat-tab label="Reviews">
                    <!-- <ng-template mat-tab-label>
                    <span (click)="getReviews(43)">Reviews</span>
                    </ng-template>
                    <div *ngFor="let r of reviews">
                    <app-review [review] = "r"></app-review>
                    </div> -->
                </mat-tab>
                <mat-tab label="Set Preferences">
                </mat-tab>
            </mat-tab-group>
        </div>
    </div>
</div>
