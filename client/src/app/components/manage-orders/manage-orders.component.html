<div class="container">
    <h2 class="pt-4 pb-4">Manage Orders</h2>
    <div class="row">
        <div class="col-12">
            <mat-tab-group animationDuration="0ms">
                <mat-tab label="ACTIVE" (click)="getOrders()">
                        <div class="panel panel-default">
                                <div class="panel-heading">
                                   <button class="btn btn-primary" (click)="onCreateOrder()">Create Order</button>
                                </div>
                        <div class="panel-body pt-5">
                                    <table class="table table-condensed table-striped">
                    <thead>
                        <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                         <th></th>
                         <th></th>
                        <th></th>
                        <th></th>
                        <th>DATE</th>
                        <th>DUE ON</th>
                        <th>TOTAL</th>
                        <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody  *ngFor="let o of orders;let i=index" >
        <tr  data-toggle="collapse" data-toggle="collapse" [attr.data-target]="orders[i]?.Name ? '#' + orders[i]?.Name : ''"  class="accordion-toggle">
            <td><button class="btn btn-default btn-xs"><span class="glyphicon glyphicon-eye-open"></span></button></td>
            <td><img src="{{orders[i]?.Profile_Pic_URL}}" width="65px" alt=""></td>
            <td>{{o.Name}} {{o.Surname}}</td>
            <td></td>
            <td></td>
            <td>{{o?.ServiceTitle}}</td>
            <td></td>
            <td>{{o?.OrderDate | date}}</td>
            <td>{{o?.OrderDate | date}}</td>
            <td>{{o?.Price }}</td>
            <!-- <td>{{o.Status}}</td> -->
            <td><span class="badge badge-success">{{o.Status}}</span></td>
          </tr>
        <tr>
            <td colspan="12" class="hiddenRow"><div [attr.id]="orders[i]?.Name"  class="accordian-body collapse">{{o?.Description}}</div></td>
        </tr>
    </tbody>
</table>

            </div>
          </div> 
                </mat-tab>
                <mat-tab label="COMPLETED">
                    
                </mat-tab>
                <mat-tab label="DRAFT">

                </mat-tab>
            </mat-tab-group>
        </div>
    </div>
</div>
