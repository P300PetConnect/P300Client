<div *ngIf="isOpen" class="container pt-5 mt-5 cognitoform">
    <amplify-authenticator [loginMechanisms]="['email']"
    [socialProviders]="['google']"
    [signUpAttributes]="[
    'name',
    'email',
    'family_name',
    ]">
      <ng-template
        amplifySlot="authenticated"
        let-user="user"
        let-signOut="signOut">
        <app-search-version2 *ngIf="user.signInUserSession.accessToken.payload['cognito:groups'][0]=='PetOwner'"></app-search-version2>
        <app-user-profile *ngIf="user.signInUserSession.accessToken.payload['cognito:groups'][0]=='PetSitter'"></app-user-profile>
      </ng-template>
    </amplify-authenticator>
 </div>
