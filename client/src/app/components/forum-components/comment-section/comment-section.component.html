<div>
  <form #myForm="ngForm" class="commentFooter">
    <div class="commentForm mx-4">
      <div class="form-group mt-4">
        <textarea type="content" class="form-control" placeholder="Comment" #comment></textarea>
      </div>
      <div class="form-group">
        <button class="btn btn-secondary px-5" (click)="PushComment(comment.value, myForm); comment.value = ''">
          Post
        </button>
      </div>
    </div>
  </form>
</div>


<div class="post1 mx-3" *ngIf="comments.length > 0">
  <div class="border mb-2" *ngFor="let c of comments">
    <div class="col-md-12">
      <div class="row post-internal">
        <div class="col-md-1 col-2">
          <div class="d-flex flex-column votebox">
            <button mat-button>
              <mat-icon (click)="AddVote(c)">arrow_upward</mat-icon>
            </button>

            <div class="p-2 postNum">{{c.voteCount}}</div>
            <button mat-button>
              <mat-icon (click)="RemoveVote(c)">arrow_downward</mat-icon>
            </button>

          </div>
        </div>
        <div class="col-md-11 col-10">
          <div class="row">
            <div class="col-md-1">
              <td><img src="{{c?.imageProfileUrl}}" class="img-profile"></td>
            </div>
            <div class="col-md-11 col-10">
              <span>
                <span><a class="post-info" href="">Posted by {{c?.name}} {{c?.surname}}</a></span>
                <span>
                  - <span class="post-info">{{c?.date}}</span>
                  <!-- <a class="username" href="">{{post?.}}</a> -->
                </span>
              </span>
            </div>
          </div>
          <hr />
          <a routerLink="post.url" class="post-title">{{c?.PostTitle}}</a>
          <div>
            <p class="post-text">{{c?.comment}}</p>
          </div>


        </div>

      </div>
    </div>
    <div class="row pb-2">
      <div class="col-md-1 col-2">

      </div>
      <div class="col-md-11 col-10">
        <div class="d-flex flex-row">
          <button mat-flat-button>
            <span class="material-symbols-outlined">
              mode_comment
            </span>
            Comments
          </button>

          <button mat-flat-button> <span class="material-symbols-outlined">
              google_plus_reshare</span>
            Share
          </button>
          <button mat-flat-button>
            <span class="material-symbols-outlined">
              bookmark
            </span>
            Save
          </button>

          <button mat-flat-button>
            <span class="material-symbols-outlined">
              more_horiz
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
