<div class="tab-content">
    <div class="tab-pane fade show active" id="account" role="tabpanel">
      <div class="card mb-3">
        <div class="card-header">
          <div class="card-actions float-end">
            <div class="dropdown position-relative">
              <a>
                <i class="bi bi-pencil-square"></i>
              </a>
            </div>
          </div>
          <h5 class="card-title mb-0">Private info</h5>
        </div>
        <div class="card-body">
          <form>
            <div class="row">
              <div class="mb-3 col-8">
                <div class="row">
                  <div class="col-6  mb-3">
                     <label for="inputFirstName"  class="form-label">First name</label>
                  <input type="text"  class="form-control" id="inputFirstName" placeholder="First name">
                  </div>
                  <div class="col-6 mb-3">
                    <label for="inputLastName" class="form-label">Last name</label>
                    <input type="text"  class="form-control" id="inputLastName" placeholder="Last name">
                  </div>
                  <div class="col-12 mb-3">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" readonly class="form-control" id="inputEmail4" >
                  </div>
                  <div class="col-12">
                     <div class="mb-3">
                     <label for="inputAddress" class="form-label">Address</label>
                     <input type="text"  class="form-control" id="inputAddress" placeholder="1234 Main St">
                   </div>
                  </div>
                </div>
              </div>
              <div class="mb-3 col-4">
                <div class="row">
                  <div class="col-md-12">
                    <div class="text-center">
                      <img alt="frank" src="https://i.guim.co.uk/img/media/831ce4428aa017e2d4c9f883be27baeef95ef894/312_237_6076_3644/master/6076.jpg?width=1200&height=1200&quality=85&auto=format&fit=crop&s=e0508d322f18a9230080d1edfd8a5315" class="rounded-circle img-responsive mt-2"
                        width="128" height="128">
                      <div class="mt-2">
                        <span class="btn btn-primary"><i class="fas fa-upload"></i> Upload</span>
                      </div>
                      <small>For best results, use an image at least 128px by 128px in .jpg format</small>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label for="inputAddress2" class="form-label">Address 2</label>
              <input type="text"  class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
            </div>
            <div class="row">
              <div class="mb-3 col-md-6">
                <label for="inputCity" class="form-label">Town</label>
                <input type="text"   class="form-control" id="inputCity">
              </div>
              <div class="mb-3 col-md-4">
                <label for="inputState" class="form-label">County</label>
                <select id="inputState"  class="form-control">
                  <option selected="">Choose...</option>
                  <option>...</option>
                </select>
              </div>
              <div class="mb-3 col-md-2">
                <label for="inputZip" class="form-label">Zip</label>
                <input type="text" class="form-control" id="inputZip">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </form>
        </div>
      </div>
