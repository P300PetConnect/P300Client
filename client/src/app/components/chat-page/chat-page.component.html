<div class="container">
    <body>
        <div class="container-fluid">

                <div class="col-3">
                    <stream-channel-list></stream-channel-list>

                    <stream-channel>

                        <stream-message-list></stream-message-list>

                    </stream-channel>
                </div>
            </div>
        </div>
    </body>
</div>
