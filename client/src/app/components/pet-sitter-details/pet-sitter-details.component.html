<div class="container">
  <div class="row">
    <div class="col-4">
      <div class="row">
        <div class="col-12">
          <div class="tab-content">
            <div class="col-md-12 col-xl-12">
              <div class="card mb-3">
                <div class="card-header d-flex justify-content-between">
                  <h5 class="card-title mb-0">Pet Sitter</h5>
                  <i class="bi bi-heart"> save</i>
                </div>
                <div class="card-body text-center pb-0 ">
                  <img src={{petSitter?.profilePicUrl}} alt="Stacie Hall" class="img-fluid rounded-circle mb-2"
                    width="128" height="128">
                  <h5 class="card-title mb-0">{{petSitter?.name}} {{petSitter?.surname}}</h5>
                  <div class="text-muted">
                  </div>
                  <div class="mt-3">
                    <div class="h-100">
                      <span class="bi bi-star-fill"></span>
                      <span class="bi bi-star-fill"></span>
                      <span class="bi bi-star-fill"></span>
                      <span class="bi bi-star-fill"></span>
                      <span class="bi bi-star-fill"></span>
                      <span class="review my-auto pl-2"><u>14 reviews</u></span>

                    </div>
                  </div>
                </div>
                <hr class="my-0">
                <div class="card-body">
                  <h5 class="pl-4 card-title">About</h5>
                  <ul class="list-group list-group-flush pb-4">
                    <li class="list-group-item "><i class="bi bi-envelope profile-icons"></i>{{petSitter?.emailAddress}}
                    </li>
                    <li class="list-group-item"><i
                        class="bi bi-telephone  profile-icons"></i>{{petSitter?.mobileNumber}}</li>
                    <a class="list-group-item"><i class="bi bi-geo-alt-fill profile-icons"></i>{{petSitter?.line1}} -
                      {{petSitter?.county}} </a>
                  </ul>
                  <div class="row text-center d-flex justify-content-center">
                  </div>
                </div>
                <hr class="my-0">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-8 pl-5">
      <mat-tab-group animationDuration="0ms">
        <mat-tab label="Active service">
          <div class="row pt-4">
            <div class="col-4">
              <div class="card p-4">
                <div class="text-center card-body">
                  <div class="member-card">
                    <i class="bi bi-plus-circle-fill text-info"></i>
                    <p>Create a new Service</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </mat-tab>
        <mat-tab label="Reviews">
        </mat-tab>
      </mat-tab-group>
    </div>
  </div>
</div>
<div>
</div>
