<div style="text-align: center; width:20rem;" >
  <img src="{{data?.order?.Profile_Pic_URL}}" class="img-profile mt-3">
<h6>{{data?.order?.Name}} {{data?.order?.Surname}}</h6>
<form class="form-horizontal" [formGroup]="addReview" (ngSubmit) = "onSubmit()">
    <div class="form-group">
      <ngb-rating [max]=5 [(rate)]="starRating"  (rateChange)="onRateChange($event)"></ngb-rating>
     <p>You selected {{starRating}} stars.</p>
    </div>
    <div class="form-group">
        <div >
            <textarea type="text" class="form-control" id="review" placeholder="How was your experience" formControlName="content"></textarea>
        </div>
      </div>
    <div class="form-group">
        <div class = "row justify-content-center px-5">
                <button type="submit" class="btn btn-success">Submit</button>
        </div>
    </div>
  </form>
</div>
