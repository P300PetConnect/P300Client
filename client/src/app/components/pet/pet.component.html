    <div class="row">
      <div class="card">
        <div class="card-header">
          <div class="card-actions float-end">
            <div class="dropdown position-relative">
              <a href="#" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" class="">
                <!-- <i class="bi bi-x-lg"></i> -->
              </a>
            </div>
          </div>
          <h5 class="card-title mb-0">Add new pet</h5>
        </div>
        <div class="card-body">
          <form>
            <div class="row">
              <div class="col-md-8">
                <div class="mb-3 row">
                  <div class="col-6">
                    <label for="inputUsername" class="form-label">Name</label>
                    <input type="text" class="form-control" id="inputUsername" placeholder="Pet Name">  
                  </div>
                <div class="col-6">
                  <label for="inputUsername" class="form-label">Date of Birthday</label>
                  <input type="text" class="form-control" id="inputUsername" placeholder="Pet Name">
                </div> 
                </div>

                <div class="row">
                  <div class="col-6">
                    <div class="row">
                      <div class="col-4">
                        <label class="form-label" for="weight">Weight</label>
                      </div>
                      <div class="col-8 text-end">
                        <a class="form-label" for="weight" (click)="isShow = !isShow">{{!isShow?'Switch to st,lb':'Switch to Kg'}}</a>
                      </div>
                    </div>
                    <div *ngIf="!isShow">
                      <input type="phone" id="weight" placeholder="Kilograms" class="form-control" />
                    </div>
                    <div>
                      <div *ngIf="isShow" class="row">
                        <div class="col-6">
                          <input type="phone" id="weight" placeholder="Stone" class="form-control" />
                        </div>
                        <div class="col-6">
                          <input type="phone" id="weight" placeholder="Paunds" class="form-control" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="inputUsername" class="form-label">Description</label>
                  <textarea rows="2" class="form-control" id="inputBio"
                    placeholder="Tell something about your pet"></textarea>
                </div>
              </div>
              <div class="col-md-4">
                <div class="text-center">
                  <img alt="pet profile picture" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeFpdmHDg4o0Yi-xBZ7kKRJvhl54_Z3jzVfXhJvPiJ26cXJA017tw6LlNzjimNqpmbDgs&usqp=CAU" class="rounded-circle img-responsive mt-2"
                    width="128" height="128">
                  <div class="mt-2">
                    <span class="btn btn-primary"><i class="fas fa-upload"></i> Upload</span>
                  </div>
                  <small>For best results, use an image at least 128px by 128px in .jpg format</small>
                </div>
              </div>
            </div>
            <button type="button" class="btn btn-outline-info mr-2">Save draft</button>
            <button type="submit" class="btn btn-primary">Save Pet</button>
          </form>
        </div>
      </div>
    </div>
