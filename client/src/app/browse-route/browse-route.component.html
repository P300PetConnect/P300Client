<!-- List of routes down here -->
<section class="head">
    <div class="container">
        <h2 style="color:black;" class="text-center"><span>Search Popular Routes</span>Created with <i
                class="fa fa-heart"></i> from PetConnect</h2>
    </div>

    <!-- Search box -->
    <section class="search-sec">
        <div class="container">
            <form action="#" method="post" novalidate="novalidate">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="row">
                            <div class="col-lg-3 col-md-3 col-sm-12 p-0">
                                <input id="inpputedID" type="text" class="form-control search-slt" [(ngModel)]="routeID"
                                    placeholder="Enter Route id">
                            </div>
                            <div class="col-lg-3 col-md-3 col-sm-12 p-0">
                                <select class="form-control search-slt" id="exampleFormControlSelect1">
                                    <option>Ireland</option>
                                </select>
                            </div>
                            <div class="col-lg-3 col-md-3 col-sm-12 p-0">
                                <select class="form-control search-slt" id="exampleFormControlSelect1">
                                    <option>Sligo</option>
                                    <option>Dublin</option>
                                    <option>Cavan</option>
                                    <option>Cork</option>
                                </select>
                            </div>
                            <div class="col-lg-3 col-md-3 col-sm-12 p-0">
                                <button type="button" (click)="getFilteredRoutes()"
                                    class="btn btn-primary wrn-btn">Search</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <!-- End of search box -->

</section>
<div class="clearfix"></div>
<section class="search-box">
    <div class="container-fluid">
        <div class="row">
