

<div style="padding: 0 6%;">
    <div class = "introContain">
      <h5>Welcome to the Pet Connect forum </h5>
      <p>Intro</p>
    </div>
  </div>

  <div class = "wallContainer">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarForum" aria-controls="#navbarForum" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarForum">
        <ul class="navbar-nav forumNav">
          <li class="nav-item">
            <a class="nav-link" (click)="GetBoardDetails('0')" style="border-left: 1px solid black;" #route>All Posts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="GetBoardDetails('1')">General</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="GetBoardDetails('2')">Pet Help</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="GetBoardDetails('3')">Walking Routes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="GetBoardDetails('4')">Questions For Pet Connect</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="GetBoardDetails('5')">Customer Reviews</a>
          </li>
        </ul>
      </div>
    </nav>

    <div style="padding: 0 6%;">
      <div class = "boardIntro">
        <div *ngFor="let b of boards;">
          <h5 class = "boardTitle">{{b[0].boardTitle}}</h5>
          <p>{{b[0].description}}</p>
        </div>
        <div style="text-align: center;">
          <button class="btn btn-secondary" (click)="toggleAddPost()">Add Post</button>
        </div>
       
      </div>
    </div>
    <div class="addPost" *ngIf = "showAddPost">
      <app-add-post [boards] = "boards" (GetForumPosts) = "GetForumPosts()"></app-add-post>
    </div>
    
      <hr>
      <div *ngFor="let d of posts[0]">
       <app-post [post]="d" ></app-post>
      </div>
        <hr>
   </div>
