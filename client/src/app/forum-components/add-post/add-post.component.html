<div class = " d-flex justify-content-center formContain">
    <div class = "col-6">
      <form #form>
          <div class="form-group" >
            <label for="title">Post Title</label>
            <input type="tile" class="form-control"  placeholder="Enter Title" #title>
           
          </div>
          <div class="form-group">
            <label for="Content">Content</label>
            <textarea type="content" class="form-control"  placeholder="content" #content></textarea>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Check me out</label>
          </div>
          <div style="text-align: center; margin-top: 10%;" >
           <p>Attach Media</p>
           <img src="../../../assets/images/downArrow.png" *ngIf="!addMedia" (click)="ToggleAddMedia()" style="width: 5%;" alt="">
           <img src="../../../assets/images/Uparrow.png" *ngIf="addMedia" (click)="ToggleAddMedia()" style="width: 5%;" alt="">
          </div>
  
  
          <div *ngIf="addMedia" class = "mediaContainer">
          <div style="margin: 10% 0;" class="row">
            <div class = "col">
              
                <img src="../../../assets/images/picture.png" class="icon"  alt="">
                <label for="picture" style="margin-right: 50%;">Add Picture</label>
                <img [src]="imageSrc" *ngIf="imageSrc" style="width:30%; margin: 5% 0;" #image>
                <input type="file" (change)="selectFile($event)">
              
            </div>
            <div class = "col">
              <img src="../../../assets/images/video.png" class = "icon" alt="">
              <label for="title">Video Link</label>
              <input type="tile" class="form-control"  placeholder="Enter URL" #video>
              <small id="emailHelp" class="form-text text-muted">Only YouTube links supported currently</small>
              
            </div>
           
          </div>
  
          <div style="text-align: center;" >
            <button class="btn btn-secondary" *ngIf="selectedFiles"  (click)="AddPostWithImage(title.value, content.value, video.value, form, image)">Upload</button>
            <button class="btn btn-secondary" *ngIf="!selectedFiles"  (click)="AddPostNoImage(title.value, content.value, video.value, form)">Upload</button>
        
        </div>
      </div>
        
      </form>
    </div>
  </div>
