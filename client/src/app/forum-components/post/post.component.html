    <div class = "post row-12">
      <div class = "row">
        <div class="col-md-12">
          <div class="row post-internal">
            <div class="col-md-1">
              <div class="d-flex flex-column votebox">
                <button mat-button>
                  <mat-icon (click)="AddVote(post)">arrow_upward</mat-icon>
                </button>
                <div class="postNum">
                  <span>{{post.VoteCount}}</span>
                </div>

                <button mat-button>
                  <mat-icon  (click)="RemoveVote(post)">arrow_downward</mat-icon>
                </button>
                </div>
              </div>
              <div class="col-md-11">
                <div class="row">
                  <div class="col-md-1">
                    <td><img src="{{post?.imageProfileUrl}}"
                      class="img-profile"></td>
                </div>
                <div class="col-11">
                  <span>
                    <span><a class="post-info" href="">Posted by {{post?.User}}</a></span>
                    <span>
                     - <span class="post-info" >{{post?.Date}}</span>
                    </span>
                  </span>
                </div>
                </div>
                <hr />
                <a routerLink="post.url" class="post-title">{{post?.PostTitle}}</a>
                <div>
                  <p class="post-text">{{post.Content}}</p>
                </div>

                
              </div>
              
        </div>
        </div>
<div class="row pb-2">
  <div class="col-1">

  </div>
  <div class="col-11">
    <div class="d-flex flex-row">
      <button mat-flat-button (click)="DisplayComments(post)">
        <span class="material-symbols-outlined">
          mode_comment
          </span>
          Comments
      </button>

      <button mat-flat-button> <span class="material-symbols-outlined">
        google_plus_reshare</span>
        Share
      </button>
      <button mat-flat-button>
      <span class="material-symbols-outlined">
        bookmark
        </span>
        Save
      </button>
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
          <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon>flag</mat-icon>
            <span>Report</span>
          </button>
          <button mat-menu-item>
            <mat-icon>link</mat-icon>
            <span>Copy link</span>
          </button>
          <button mat-menu-item>
            <mat-icon>visibility_off</mat-icon>
            <span>Not interested in this</span>
          </button>
        </mat-menu>


        </div>
      </div>
                
      </div>
      </div>
        <div class = "row" *ngIf="post.DisplayComments">
          <app-comment-section [docID]="post.PostID" [postData]="postData"></app-comment-section>
        </div> 
        
    </div>
