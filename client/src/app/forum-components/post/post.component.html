<div  class = "">
    <div class = "post row" >
      <div class = "col postHeader">
        <Button class = "btn btn-danger close">&#10005;</Button>
        <div *ngIf="post.imageLocation != 'N/A'" style="text-align: center;">
          <img src="{{post.imageLocation}}" class = "postImage" alt="">
        </div>
        
          <div class = "row">
           <h6>{{post.Date.S}}</h6>
          </div>
          <div class = "row">
              <h5>{{post.PostTitle.S}}</h5>
          </div>
          <div class = "col">
              <p>{{post.Content.S}}</p> 
          </div>
          

        </div>
        <div class = "row postFooter" >
          <div class = "like col">
              <img src="../../../assets/images/Uparrow.png" class = "beside" alt="" (click)="AddVote(post, post.DisplayComments.BOOL)">
              <p class = "beside" style="margin-right: 10px;">{{post.VoteCount.N}}</p>
              <img src="../../../assets/images/downArrow.png" class = "beside" alt="" (click)="RemoveVote(post, post.DisplayComments.BOOL)">
         </div>
          <div class = "like col">
          <img src="../../../assets/images/comment.png" alt="" (click)="DisplayComments(post, post.DisplayComments.BOOL)">
          </div>
          <div class = "like col">
              <img src="../../../assets/images/share.png" alt="">
              </div>
        </div>
        <div class = "row" *ngIf="post.DisplayComments.BOOL">
          
          <app-comment-section [docID]="post.PostID.S" [postData]="postData"></app-comment-section>
        </div> 

    </div>
  </div>
