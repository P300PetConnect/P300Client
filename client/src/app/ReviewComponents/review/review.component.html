<div class="container pt-5 p-0">
    <div class="card">
      <div class="card-body">
        <div class="row">
      
          <div class="col-md-2">
            <img
              src="{{review.Profile_Pic_URL}}"
              class="img-fluid rounded-circle mb-2" />
          </div>

          <div class="col-md-10">
            <p>
              <a class="float-left" href=""><strong>{{review.Name + ' ' + review.Surname}}</strong></a>

              <span *ngFor="let n of numSequence(review.ReviewRating)" class=" float-right bi bi-star-fill"></span>
         
            </p>

            <div class="clearfix m-0 p-0"></div>
            <p class="p-0 m-0">{{review.ReviewContent}}
            </p>
            <a class=" float-right review-time text-secondary text-right">{{review.ReviewDate}}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
