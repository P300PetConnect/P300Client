<div>


<Button class = "btn btn-danger position-absolute top-0 end-0" (click)="close()" >&#10005;</Button>
             
<h4 class = "text-center text-decoration-underline">Leave a review for Father Ted</h4>
<form class="form-horizontal" [formGroup]="addReview" (ngSubmit) = "onSubmit()">
   
    <div class="form-group">
        <mat-form-field appearance="outline">
            <mat-label>Star Rating</mat-label>
            <mat-select [(value)]="selected">
              <mat-option *ngFor="let s of stars" value="{{s}}" >
                {{s}}
              </mat-option>
            </mat-select>
          </mat-form-field>
    </div>

    <div class="form-group">
    
        <div class="col-sm-10">
            <textarea type="text" class="form-control" id="review" placeholder="Enter review" formControlName="content"></textarea>
       
        </div>
      </div>
   
    <div class="form-group">
        <div class = "row justify-content-center px-5">
            
                <button type="submit" class="btn btn-success">Submit</button>
         
        </div>


    
    </div>
  </form>
</div>
